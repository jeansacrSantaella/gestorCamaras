<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámaras</title>
<script>
  (() => {
    let tema;
    try { tema = localStorage.getItem('tema'); } catch (e) {}
    if (tema !== 'claro' && tema !== 'oscuro') {
      tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
    }
    document.documentElement.dataset.tema = tema;
    document.documentElement.dataset.bsTheme = tema === 'oscuro' ? 'dark' : 'light';
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Cámaras</h1>
    <nav class="vistas" id="vistas" aria-label="Vista"></nav>
    <div class="acciones">
      <button id="cambiar-tema" type="button" class="btn btn-outline-secondary btn-sm"></button>
      <button id="abrir-config" type="button" class="btn btn-primary btn-sm">Configurar</button>
    </div>
  </header>
  <main>
    <div class="rejilla todas" id="rejilla"></div>
    <p id="vacio" hidden>Aún no hay cámaras. Usa «Configurar» para agregar la primera.</p>
    <p class="pista">Flechas del teclado para girar la cámara. El zoom es digital.</p>
    <div id="estado" role="status" aria-live="polite"></div>
  </main>
  <div id="aviso" hidden>
    <div class="aviso-caja">
      <p id="aviso-texto"></p>
      <button id="aviso-boton" type="button" class="btn btn-primary">Volver a conectar</button>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="config">
    <form method="dialog" class="cfg-cab"><h2>Configurar cámaras</h2><button aria-label="Cerrar">✕</button></form>
    <label id="cfg-pin" hidden>PIN de administrador <input id="pin" class="form-control" type="password" autocomplete="off"></label>
    <ul id="cfg-lista"></ul>
    <form id="cfg-form">
      <h3>Agregar cámaras</h3>
      <label>IP o IPs (una por línea o separadas por coma)
        <textarea id="f-ips" class="form-control" rows="3" placeholder="192.168.1.69&#10;192.168.1.72" required></textarea></label>
        <label>Nombre (opcional) <input id="f-nombre" class="form-control" maxlength="40"></label>
      <details><summary>Opciones avanzadas</summary>
          <label>Puerto RTSP <input id="f-rtsp" class="form-control" type="number" value="554" min="1" max="65535"></label>
          <label>Ruta RTSP <input id="f-ruta" class="form-control" value="/live/ch00_0"></label>
          <label>Puerto ONVIF <input id="f-onvif" class="form-control" type="number" value="8899" min="1" max="65535"></label>
          <label>Usuario <input id="f-usuario" class="form-control" autocomplete="off"></label>
          <label>Contraseña <input id="f-clave" class="form-control" type="password" autocomplete="new-password"></label>
      </details>
      <p id="cfg-msg" role="status"></p>
      <button type="submit" class="btn btn-primary">Agregar</button>
    </form>
  </dialog>

<script>
  const botonTema = document.getElementById('cambiar-tema');
  function actualizarBotonTema() {
    const oscuro = document.documentElement.dataset.tema === 'oscuro';
    botonTema.textContent = oscuro ? '☀ Modo claro' : '☾ Modo oscuro';
    botonTema.setAttribute('aria-label', oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  }
  actualizarBotonTema();
  botonTema.addEventListener('click', () => {
    const tema = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    document.documentElement.dataset.tema = tema;
    document.documentElement.dataset.bsTheme = tema === 'oscuro' ? 'dark' : 'light';
    try { localStorage.setItem('tema', tema); } catch (e) {}
    actualizarBotonTema();
  });

  const HOST = location.hostname;
  const VELOCIDAD = 0.7;
  const ZOOM_MIN = 1, ZOOM_MAX = 4, ZOOM_PASO = 0.5;
  const rejilla = document.getElementById('rejilla');
  const barra = document.getElementById('vistas');
  const estado = document.getElementById('estado');
  const tiles = new Map();
  let vista = 'todas';
  try { vista = localStorage.getItem('vista') || 'todas'; } catch (e) {}

  async function api(ruta, cuerpo) {
    try {
      const r = await fetch(ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Sesion': sesion || '' },
        body: JSON.stringify(cuerpo || {})
      });
      if (r.status === 403) { pulso(); return; }
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.status); }
      estado.textContent = '';
    } catch (e) { estado.textContent = 'La cámara no respondió: ' + e.message; }
  }

  function crearTile(cam) {
    const nombre = cam.id;
    const el = document.createElement('section');
    el.className = 'tile';
    el.innerHTML = `
      <div class="cabecera">
        <h2><span class="punto" aria-hidden="true"></span></h2>
        <button class="ampliar btn btn-outline-secondary btn-sm" type="button">Ampliar</button>
      </div>
      <div class="vista"><iframe title="Video de ${nombre}" allow="autoplay"></iframe></div>
      <div class="mandos">
        <div class="cruz" role="group" aria-label="Girar ${nombre}">
          <button class="btn btn-outline-secondary" data-x="0" data-y="1" aria-label="Arriba">↑</button>
          <button class="btn btn-outline-secondary" data-x="-1" data-y="0" aria-label="Izquierda">←</button>
          <button class="btn btn-outline-secondary" data-x="1" data-y="0" aria-label="Derecha">→</button>
          <button class="btn btn-outline-secondary" data-x="0" data-y="-1" aria-label="Abajo">↓</button>
        </div>
        <div class="zoom" role="group" aria-label="Zoom de ${nombre}">
          <button class="btn btn-outline-secondary" data-z="-1" aria-label="Alejar">−</button>
          <output>1×</output>
          <button class="btn btn-outline-secondary" data-z="1" aria-label="Acercar">+</button>
        </div>
      </div>`;

    el.querySelector('h2').append(cam.nombre);
    el.querySelectorAll('.cruz button').forEach(b => {
      const x = parseFloat(b.dataset.x) * VELOCIDAD, y = parseFloat(b.dataset.y) * VELOCIDAD;
      b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); api(`/api/${nombre}/mover`, { x, y }); });
      const parar = () => api(`/api/${nombre}/parar`);
      b.addEventListener('pointerup', parar);
      b.addEventListener('pointercancel', parar);
      b.addEventListener('contextmenu', e => e.preventDefault());
    });

    let zoom = 1;
    const video = el.querySelector('iframe'), etiqueta = el.querySelector('output');
    el.querySelectorAll('.zoom button').forEach(b => b.addEventListener('click', () => {
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom + parseInt(b.dataset.z) * ZOOM_PASO));
      video.style.transform = `scale(${zoom})`;
      etiqueta.textContent = `${zoom}×`;
    }));
    el.querySelector('.ampliar').addEventListener('click', () => elegir(nombre));

    // Solo las cámaras visibles piden video: las ocultas liberan su conexión.
    let activo = false;
    const url = `http://${HOST}:1984/stream.html?src=${encodeURIComponent(nombre)}&mode=mse`;
    return {
      el,
      setActivo(on) {
        if (on === activo) return;
        activo = on;
        video.src = on ? url : 'about:blank';
      }
    };
  }

  function elegir(v) {
    vista = v;
    try { localStorage.setItem('vista', v); } catch (e) {}
    aplicar();
  }

  function aplicar() {
    if (vista !== 'todas' && !tiles.has(vista)) vista = 'todas';
    rejilla.className = 'rejilla ' + (vista === 'todas' ? 'todas' : 'una');
    tiles.forEach((t, n) => {
      const visible = vista === 'todas' || vista === n;
      t.el.hidden = !visible;
      t.setActivo(visible && !!sesion);
    });
    barra.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === vista));
  }

  const teclas = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  let teclaActiva = null;
  document.addEventListener('keydown', e => {
    const d = teclas[e.key];
    if (vista === 'todas' || !d || e.repeat) return;
    e.preventDefault();
    teclaActiva = e.key;
    api(`/api/${vista}/mover`, { x: d[0] * VELOCIDAD, y: d[1] * VELOCIDAD });
  });
  document.addEventListener('keyup', e => {
    if (e.key === teclaActiva && vista !== 'todas') { teclaActiva = null; api(`/api/${vista}/parar`); }
  });

  // --- Límite de conexiones: el servidor lleva la cuenta y cierra la más antigua ---
  let sesion = null, temporizador = null;
  const aviso = document.getElementById('aviso');
  const avisoTexto = document.getElementById('aviso-texto');
  const avisoBoton = document.getElementById('aviso-boton');

  function toast(texto) {
    const t = document.getElementById('toast');
    t.textContent = texto; t.hidden = false;
    setTimeout(() => { t.hidden = true; }, 8000);
  }

  function sesionPerdida() {
    sesion = null;
    clearInterval(temporizador);
    aplicar();  // apaga los videos
    avisoTexto.textContent = 'Tu sesión se cerró porque otra persona se conectó. Solo puede haber 2 conexiones a la vez.';
    aviso.hidden = false;
  }

  async function abrirSesion() {
    try {
      const r = await fetch('/api/sesion', { method: 'POST' });
      const d = await r.json();
      sesion = d.id;
      aviso.hidden = true;
      aplicar();  // enciende los videos
      if (d.desplazo) toast('Ya había ' + d.max + ' conexiones: se cerró la más antigua.');
      clearInterval(temporizador);
      temporizador = setInterval(pulso, 5000);
    } catch (e) { estado.textContent = 'No se pudo abrir la sesión: ' + e.message; }
  }

  async function pulso() {
    if (!sesion) return;
    try {
      const r = await fetch(`/api/sesion/${sesion}/latido`, { method: 'POST' });
      const d = await r.json();
      if (d.estado === 'expulsada') sesionPerdida();
      else if (d.estado === 'desconocida') abrirSesion();
    } catch (e) { /* sin red: se reintenta en el siguiente pulso */ }
  }

  addEventListener('pagehide', () => { if (sesion) navigator.sendBeacon(`/api/sesion/${sesion}/salir`); });
  avisoBoton.addEventListener('click', abrirSesion);

  // --- Cámaras dinámicas: la lista vive en el servidor (data/cameras.json) ---
  let primera = true, ultimaFirma = '';
  const dlg = document.getElementById('config');
  const msg = document.getElementById('cfg-msg');

  async function cfg(ruta, opciones) {
    const r = await fetch(ruta, { ...opciones, headers: { 'Content-Type': 'application/json', 'X-Admin': document.getElementById('pin').value } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Datos no válidos');
    return d;
  }

  function listaConfig(lista) {
    const ul = document.getElementById('cfg-lista');
    ul.replaceChildren();
    lista.forEach(c => {
      const li = document.createElement('li');
      const txt = document.createElement('span');
      txt.textContent = `${c.nombre} — ${c.ip}`;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-outline-danger btn-sm'; b.textContent = 'Quitar';
      b.addEventListener('click', async () => {
        if (!confirm(`¿Quitar «${c.nombre}»?`)) return;
        try { await cfg(`/api/camaras/${c.id}`, { method: 'DELETE' }); msg.textContent = ''; await cargarCamaras(); }
        catch (e) { msg.textContent = e.message; }
      });
      li.append(txt, b);
      ul.appendChild(li);
    });
  }

  async function cargarCamaras() {
    let lista;
    try { lista = await (await fetch('/api/camaras')).json(); }
    catch (e) { estado.textContent = 'No se pudo cargar la lista de cámaras.'; return; }
    const firma = JSON.stringify(lista);
    if (firma === ultimaFirma) return;
    ultimaFirma = firma;
    const ids = lista.map(c => c.id);
    tiles.forEach((t, id) => { if (!ids.includes(id)) { t.setActivo(false); t.el.remove(); tiles.delete(id); } });
    lista.forEach(c => { if (!tiles.has(c.id)) { const t = crearTile(c); tiles.set(c.id, t); rejilla.appendChild(t.el); } });
    barra.replaceChildren();
    ['todas', ...lista].forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.v = c === 'todas' ? c : c.id;
      b.className = 'btn btn-sm';
      b.textContent = c === 'todas' ? 'Todas' : c.nombre;
      b.addEventListener('click', () => elegir(b.dataset.v));
      barra.appendChild(b);
    });
    document.getElementById('vacio').hidden = lista.length > 0;
    listaConfig(lista);
    aplicar();
    if (primera) { primera = false; abrirSesion(); }
  }

  document.getElementById('abrir-config').addEventListener('click', async () => {
    try {
      const d = await (await fetch('/api/config/estado')).json();
      document.getElementById('cfg-pin').hidden = !d.protegido;
    } catch (e) {}
    msg.textContent = '';
    dlg.showModal();
  });

  document.getElementById('cfg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value;
    try {
      const d = await cfg('/api/camaras', { method: 'POST', body: JSON.stringify({
        ips: v('f-ips'), nombre: v('f-nombre'), puerto_rtsp: +v('f-rtsp'), ruta_rtsp: v('f-ruta'),
        puerto_onvif: +v('f-onvif'), usuario: v('f-usuario'), clave: v('f-clave') }) });
      msg.textContent = `Agregadas: ${d.agregadas.length}` + (d.omitidas.length ? `. Ya existían: ${d.omitidas.join(', ')}` : '');
      document.getElementById('f-ips').value = '';
      document.getElementById('f-clave').value = '';
      await cargarCamaras();
    } catch (err) { msg.textContent = err.message; }
  });

  cargarCamaras();
  setInterval(cargarCamaras, 10000);
</script>
</body>
</html>
